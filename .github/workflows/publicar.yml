# Publica la imagen de `api` en GHCR.
#
# ── Por qué es un workflow aparte de `ci.yml` ────────────────────────────────
#
# `ci.yml` corre en cada push y en cada PR: su trabajo es decir si el código
# está sano. Este corre solo sobre `main` y su trabajo es publicar un artefacto.
# Mezclarlos haría que cada PR construya una imagen que nadie va a usar.
#
# ── Depende del CI, y eso es el punto ───────────────────────────────────────
#
# `needs` con el workflow de tests: una imagen publicada es una imagen que
# alguien va a desplegar. Publicar sin que los tests hayan pasado convierte a
# GHCR en un lugar donde conviven versiones sanas y rotas sin forma de
# distinguirlas.

name: api-publicar

on:
  push:
    branches: [main]
  # Para poder republicar una versión sin tocar el código.
  workflow_dispatch:

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dos etiquetas por imagen: `latest` para probar, y el SHA del commit
      # para el despliegue. El `.env` de producción fija el SHA — con `latest`,
      # un `docker compose up` cambiaría la versión sin que nadie lo decida, y
      # volver atrás dejaría de ser cambiar un número.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/aquazaku-api
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # La caché de GitHub Actions evita reinstalar dependencias en cada
          # publicación: el lockfile casi nunca cambia y el código sí.
          cache-from: type=gha
          cache-to: type=gha,mode=max
